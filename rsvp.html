<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Carmela's Invitation" />
  <meta property="og:description" content="You are warmly invited! Click to view details." />
  <meta property="og:image" content="https://nonaquographics.github.io/CarmelaInvitation/thumbnailplatform.png" />
  <meta property="og:url" content="https://nonaquographics.github.io/CarmelaInvitation/" />
  <meta property="og:type" content="website" />
<title>rsvp</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --logo-size: clamp(70px, 18vw, 150px); 

    --letter-width: clamp(270px, 85vw, 680px); 
    --letter-top-offset: 70px;                 
    --letter-shift-x: 40px;                     

    --confirm-width: clamp(120px, 35vw, 4px); 
    --confirm-bottom: 17%;                     
    --confirm-left: 51%;                       
    --confirm-shift-x: -50%;                   

    --line-width: 100%;                        
    --line-offset-y: -92px;                      
    --line-shift-x: 0px;                       

    --hero-max-width: 740px;                  
    --marquee-height: 480px;             
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
  }

  .rsvp-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding-top: var(--letter-top-offset);
    padding-bottom: 120px;
    background-color: #000000;
  }

  .rsvp-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: url('rsvpbg.png') center top / cover no-repeat;
    z-index: 0;
    pointer-events: none;
  }

  .site-header,
  .rsvp-letter-wrapper,
  .dresscode-hero-wrapper,
  .marquee-section {
    position: relative;
    z-index: 2;
  }

  .site-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 15px 4vw;
    pointer-events: none;
  }

  .logo-link {
    display: block !important;
    width: var(--logo-size) !important;
    height: var(--logo-size) !important;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .logo-img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    transition: transform 0.2s ease, filter 0.2s ease;
    filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.5));
  }

  .logo-link:hover .logo-img {
    transform: scale(1.08);
    filter: drop-shadow(0px 4px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 6px rgba(0, 0, 0, 0.5));
  }

  .nav-menu {
    display: flex;
    gap: clamp(12px, 4vw, 40px);
    align-items: center;
    pointer-events: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(50px, 8vw, 100px); 
    height: clamp(50px, 8vw, 100px); 
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .home-item { --scale: 1.1; }
  .rsvp-item { --scale: 1.1; }
  .where-item { --scale: 1.3; }

  .nav-item img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    display: block !important;
    object-fit: contain !important;
    transform: translate(-50%, -50%) scale(var(--scale, 1)) !important;
    transition: opacity 0.15s ease;
    filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
  }

  .nav-item img.hover-img {
    opacity: 0;
    pointer-events: none;
  }

  .nav-item:hover img.default-img { opacity: 0; }
  .nav-item:hover img.hover-img {
    opacity: 1;
    animation: stopMotion2D 0.3s steps(1) infinite !important;
  }

  @keyframes stopMotion2D {
    0% { rotate: 0deg; translate: 0px 0px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6)); }
    25% { rotate: 2deg; translate: 1px -1px; filter: drop-shadow(0px 0px 8px rgba(240,217,166,0.6)); }
    50% { rotate: 0deg; translate: 0px 1px; filter: drop-shadow(0px 0px 6px rgba(240,217,166,0.4)); }
    75% { rotate: -2deg; translate: -1px -1px; filter: drop-shadow(0px 0px 10px rgba(240,217,166,0.7)); }
  }

  .rsvp-letter-wrapper {
    position: relative;
    width: var(--letter-width);
    transform: translateX(var(--letter-shift-x));
    display: flex;
    justify-content: center;
    margin: 0 auto;
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.7));
  }

  .rsvp-letter-img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .confirm-button-link {
    position: absolute;
    bottom: var(--confirm-bottom);
    left: var(--confirm-left);
    transform: translateX(var(--confirm-shift-x));
    width: var(--confirm-width);
    display: inline-block;
    text-decoration: none;
    cursor: pointer;
    z-index: 10;
  }

  .confirm-img-container {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .confirm-img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: opacity 0.15s ease;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
  }

  .confirm-line-img {
    position: absolute;
    top: 100%;
    left: 50%;
    width: var(--line-width);
    height: auto;
    transform: translateX(calc(-50% + var(--line-shift-x))) translateY(var(--line-offset-y));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    filter: drop-shadow(0 0 6px rgba(240, 217, 166, 0.6));
  }

  .confirm-button-link:hover .confirm-img {
    opacity: 0;
  }

  .confirm-button-link:hover .confirm-line-img {
    opacity: 1;
    animation: linePulse 0.3s steps(1) infinite !important;
  }

  @keyframes linePulse {
    0% { rotate: 0deg; translate: 0px 0px; }
    25% { rotate: 2deg; translate: 1px -1px; filter: drop-shadow(0px 0px 8px rgba(240,217,166,0.6)); }
    50% { rotate: 0deg; translate: 0px 1px; filter: drop-shadow(0px 0px 6px rgba(240,217,166,0.4)); }
    75% { rotate: -2deg; translate: -1px -1px; filter: drop-shadow(0px 0px 10px rgba(240,217,166,0.7)); }
  }

  .dresscode-hero-wrapper {
    width: 92vw;
    max-width: var(--hero-max-width);
    margin: 120px auto 60px auto;
    display: flex;
    justify-content: center;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
  }

  .dresscode-hero-img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .marquee-section {
    width: 100vw;
    margin: 40px 0 0 0;
    overflow: hidden;
    position: relative;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: #050505;
  }

  .marquee-viewport {
    width: 100%;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: infiniteScroll 38s linear infinite;
  }

  .marquee-track:hover {
    animation-play-state: paused;
  }

  @keyframes infiniteScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .marquee-tile {
    width: 300px;
    height: var(--marquee-height);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
  }

  .marquee-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s ease;
    filter: brightness(0.9) contrast(1.05);
  }

  .marquee-tile:hover img {
    transform: scale(1.06);
    filter: brightness(1) contrast(1.1);
  }

  .text-tile {
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    position: relative;
  }

  .text-tile::before {
    content: "";
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }

  .text-tile.style-1 {
    background: linear-gradient(135deg, #0a0a0a 0%, #000000 100%);
    color: #f4f2eb;
  }

  .text-tile.style-2 {
    background: linear-gradient(135deg, #1f0303 0%, #0d0101 100%);
    color: #e63939;
  }
  
  .text-tile.style-2::before {
    border-color: rgba(230, 57, 57, 0.2);
  }

  .text-content {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.08em;
    z-index: 1;
  }

  .text-content span {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    text-transform: none;
    font-size: 40px;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .tile-footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1;
    font-size: 12px;
    letter-spacing: 0.2em;
    opacity: 0.6;
  }

  .arrow-indicator {
    font-size: 26px;
    font-weight: normal;
  }

  .site-footer {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
    margin-top: auto; 
    position: relative;
    z-index: 10;
  }

  .credits-img {
    max-width: clamp(150px, 40vw, 300px); 
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  }

  @media (max-width: 600px) {
    :root {
      --letter-top-offset: 130px;
      --marquee-height: 260px; 
    }

    .rsvp-container::before {
      background-image: url('rsvpmobile.png') !important;
    }

    .confirm-button-link {
      width: 62px !important;  
      bottom: 17% !important;   
      left: 51% !important;     
    }
    
    .dresscode-hero-wrapper {
      background: none !important;
      padding: 0 !important;
      margin-top: 200px !important;
      margin-bottom: 30px !important;
    }

    .marquee-viewport {
      width: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .marquee-tile {
      width: 180px !important;  
    }

    .site-header {
      padding: 10px 15px;
    }

    .nav-menu {
      gap: 10px;
    }

    .nav-item {
      width: 55px;
      height: 55px;
    }

    .rsvp-letter-wrapper {
      margin-top: 130px !important;  
      margin-left: 5px !important;
    }

    .text-tile {
      padding: 20px 15px;
    }

    .text-content {
      font-size: 15px;
    }

    .text-content span {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<div class="rsvp-container">
  
  <header class="site-header">
    <a href="index.html" class="logo-link" title="Home">
      <img src="Logo.png" alt="Logo" class="logo-img" />
    </a>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item home-item">
        <img src="HOME.png" alt="Home" class="default-img" />
        <img src="HOMELINE.png" alt="Home" class="hover-img" />
      </a>
      <a href="rsvp.html" class="nav-item rsvp-item">
        <img src="RSVP.png" alt="RSVP" class="default-img" />

      </a>
      <a href="where.html" class="nav-item where-item">

    </nav>

  <div class="rsvp-letter-wrapper">
    <img src="rsvpletter.png" alt="RSVP Letter" class="rsvp-letter-img" />

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdvxL1HIcgzl25Sc59DRgaymSPoYBWZj4iObOvNvTctZqRLKA/viewform" target="_blank" rel="noopener noreferrer" class="confirm-button-link">
      <div class="confirm-img-container">
        <img src="confirm.png" alt="Confirm Attendance" class="confirm-img" />
        <img src="confirmline.png" alt="Confirm Hover Line" class="confirm-line-img" />
      </div>
    </a>
  </div>

  <div class="dresscode-hero-wrapper">
    <img src="dresscode.png" alt="Dress Code Instructions" class="dresscode-hero-img" />

  <div class="marquee-section">
    <div class="marquee-viewport">
      <div class="marquee-track">
        
        <div class="marquee-tile text-tile style-1">
          <div class="text-content">

        <div class="marquee-tile"><img src="4.jpeg" alt="Outfit 4" /></div>
        <div class="marquee-tile"><img src="5.jpeg" alt="Outfit 5" /></div>
        <div class="marquee-tile"><img src="6.jpeg" alt="Outfit 6" /></div>
        <div class="marquee-tile"><img src="7.jpeg" alt="Outfit 7" /></div>
        <div class="marquee-tile"><img src="8.jpeg" alt="Outfit 8" /></div>

        <div class="marquee-tile"><img src="10.jpeg" alt="Outfit 10" /></div>
        <div class="marquee-tile"><img src="11.jpeg" alt="Outfit 11" /></div>
        <div class="marquee-tile"><img src="12.jpeg" alt="Outfit 12" /></div>

        <div class="marquee-tile text-tile style-1">
          <div class="text-content">
            CODE // 01
            <span>Semi Formal</span>
          </div>
          <div class="tile-footer-info">
            <span>ATTIRE</span>
            <span class="arrow-indicator">&rarr;</span>
          </div>
        </div>

        <div class="marquee-tile"><img src="1.jpeg" alt="Outfit 1" /></div>
        <div class="marquee-tile"><img src="2.jpeg" alt="Outfit 2" /></div>
        <div class="marquee-tile"><img src="3.jpeg" alt="Outfit 3" /></div>

        <div class="marquee-tile text-tile style-2">
          <div class="text-content">
            PALETTE // 02
            <span>All-Black</span>
          </div>
          <div class="tile-footer-info">
            <span>TONE</span>
            <span class="arrow-indicator">&rarr;</span>

        </div>

        <div class="marquee-tile"><img src="4.jpeg" alt="Outfit 4" /></div>
        <div class="marquee-tile"><img src="5.jpeg" alt="Outfit 5" /></div>

        <div class="marquee-tile"><img src="7.jpeg" alt="Outfit 7" /></div>
        <div class="marquee-tile"><img src="8.jpeg" alt="Outfit 8" /></div>
        <div class="marquee-tile"><img src="9.jpeg" alt="Outfit 9" /></div>
        <div class="marquee-tile"><img src="10.jpeg" alt="Outfit 10" /></div>

      </div>
    </div>

  <footer class="site-footer">
    <img src="credits.png" alt="Credits" class="credits-img" />
  </footer>

</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('img').forEach(img => {
    // Prevent right-click menu on images
    img.addEventListener('contextmenu', e => e.preventDefault());
    // Prevent dragging images
    img.setAttribute('draggable', 'false');
  });
});
</script>

</body>
</html>
