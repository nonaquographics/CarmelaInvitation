<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where - Birthday Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --logo-size: clamp(70px, 18vw, 150px); 
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
  }

  .where-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    padding-top: 130px;
    padding-bottom: 50px;
    background: 
      linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.8) 70%, #000000 100%), 
      url('RosesBg.webp') center/cover no-repeat fixed;
  }

  /* --- SITE HEADER & NAV --- */
  .site-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 15px 4vw;
    pointer-events: none;
  }

  .logo-link {
    display: block !important;
    width: var(--logo-size) !important;
    height: var(--logo-size) !important;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .logo-img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    transition: transform 0.2s ease, filter 0.2s ease;
    filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.5));
  }

  .logo-link:hover .logo-img {
    transform: scale(1.08);
    filter: drop-shadow(0px 4px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 6px rgba(0, 0, 0, 0.5));
  }

  .nav-menu {
    display: flex;
    gap: clamp(12px, 4vw, 40px);
    align-items: center;
    pointer-events: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(50px, 8vw, 100px); 
    height: clamp(50px, 8vw, 100px); 
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .home-item { --scale: 1.1; }
  .rsvp-item { --scale: 1.1; }
  .where-item { --scale: 1.3; }

  .nav-item img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    display: block !important;
    object-fit: contain !important;
    transform: translate(-50%, -50%) scale(var(--scale, 1)) !important;
    transition: opacity 0.15s ease;
    filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
  }

  .nav-item img.hover-img {
    opacity: 0;
    pointer-events: none;
  }

  .nav-item:hover img.default-img { opacity: 0; }
  .nav-item:hover img.hover-img {
    opacity: 1;
    animation: stopMotion2D 0.3s steps(1) infinite !important;
  }

  @keyframes stopMotion2D {
    0% { rotate: 0deg; translate: 0px 0px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6)); }
    25% { rotate: 2deg; translate: 1px -1px; filter: drop-shadow(0px 0px 8px rgba(240,217,166,0.6)); }
    50% { rotate: 0deg; translate: 0px 1px; filter: drop-shadow(0px 0px 6px rgba(240,217,166,0.4)); }
    75% { rotate: -2deg; translate: -1px -1px; filter: drop-shadow(0px 0px 10px rgba(240,217,166,0.7)); }
  }

  /* --- EXPANDED DARK MAP CONTAINER --- */
  .dark-map-section {
    width: 94vw;
    max-width: 1200px;
    transform: translateY(40px);
  }

  .dark-map-frame {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(201, 166, 107, 0.4);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(201, 166, 107, 0.15);
    background-color: #000000;
  }

  /* CUSTOM DARK FILTER & HEIGHT */
  .dark-map-frame iframe {
    display: block;
    height: clamp(500px, 72vh, 800px);
    filter: invert(92%) hue-rotate(180deg) contrast(118%) saturate(140%);
    transition: filter 0.3s ease;
  }

  .dark-map-frame:hover iframe {
    filter: invert(92%) hue-rotate(180deg) contrast(110%) saturate(150%);
  }

  /* --- FOOTER / CREDITS STYLES --- */
  .site-footer {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
    margin-top: auto; 
    position: relative;
    z-index: 10;

    /* --- ADJUST CREDITS UP / DOWN HERE --- */
    transform: translateY(50px); /* Increase value to move DOWN, use negative (e.g. -20px) to move UP */
  }

  .credits-img {
    max-width: clamp(150px, 40vw, 300px);
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  }

  /* --- MOBILE RESPONSIVENESS --- */
  @media (max-width: 600px) {
    .where-container {
      padding-top: 160px;
      padding-bottom: 20px;
      background: 
        linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.8) 70%, #000000 100%), 
        url('rosesmobile.png') center/cover no-repeat fixed;
    }

    .site-header {
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding-top: 10px;
    }

    .nav-item {
      width: clamp(70px, 16vw, 110px);
      height: clamp(70px, 16vw, 110px);
    }

    .dark-map-section {
      width: 95vw;
    }

    .dark-map-frame iframe {
      height: 65vh;
    }

    .site-footer {
      /* Mobile specific vertical position tweak */
      transform: translateY(30px); 
    }
  }
</style>
</head>
<body>

<div class="where-container">

  <!-- SITE HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo-link" title="Home">
      <img src="Logo.png" alt="Logo" class="logo-img" />
    </a>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item home-item">
        <img src="HOME.png" alt="Home" class="default-img" />
        <img src="HOMELINE.png" alt="Home" class="hover-img" />
      </a>
      <a href="rsvp.html" class="nav-item rsvp-item">
        <img src="RSVP.png" alt="RSVP" class="default-img" />
        <img src="RSVPLINE.png" alt="RSVP" class="hover-img" />
      </a>
      <a href="where.html" class="nav-item where-item">
        <img src="WHERE.png" alt="Where" class="default-img" />
        <img src="WHERELINE.png" alt="Where" class="hover-img" />
      </a>
    </nav>
  </header>

  <!-- EMBEDDED LARGE DARK MAP -->
  <div class="dark-map-section">
    <div class="dark-map-frame">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3869.9115657023585!2d121.14217907595354!3d14.082397486344794!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x33bd6f66457d64a9%3A0x535a68aad25e9cab!2sVilla%20Carandang%20Resort%20And%20Function%20Hall!5e0!3m2!1sen!2sph!4v1785694328678!5m2!1sen!2sph" 
        width="100%" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </div>
  
  <!-- SITE FOOTER / CREDITS -->
  <footer class="site-footer">
    <img src="credits.png" alt="Credits" class="credits-img" />
  </footer>

</div>

</body>
</html>
