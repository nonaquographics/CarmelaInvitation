<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Invitation Envelope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-light:#F7F0DF;
    --paper:#EEE4CD;
    --paper-shadow:#D9CBA4;
    --paper-deep:#C7B586;
    --paper-line:rgba(52,40,18,0.28);
    --gold:#C9A66B;
    --gold-bright:#F0D9A6;
    --bg:#08070a;
    --card1:#171512;
    --card2:#231e17;
    --logo-size: clamp(70px, 18vw, 150px); 

    /* =========================================================
       COUNTDOWN SIZING & SPACING CONTROLS (DESKTOP DEFAULT)
       ========================================================= */
    --digit-width: clamp(28px, 7.5vw, 65px);      
    --digit-height: clamp(42px, 11vw, 98px);     
    --digit-gap: clamp(-18px, -2.5vw, -40px);         
    
    --label-height: clamp(24px, 6vw, 68px);     
    
    --colon-width: clamp(12px, 3.5vw, 40px);      
    --colon-height: clamp(22px, 6vw, 50px);     
    
    --until-width: clamp(160px, 50vw, 340px);     
    
    --countdown-gap: clamp(4px, 1.5vw, 24px);    

    /* --- POSITIONING CONTROLS --- */
    --until-margin-top: clamp(4px, 1.5vw, 20px); 
    --colon-offset-y: 2px;  

    /* =========================================================
       INDIVIDUAL DIGIT SIZING (Width / Height)
       ========================================================= */
    --days-digit-width: var(--digit-width);
    --days-digit-height: var(--digit-height);

    --hours-digit-width: var(--digit-width);
    --hours-digit-height: var(--digit-height);

    --mins-digit-width: var(--digit-width);
    --mins-digit-height: var(--digit-height);

    --secs-digit-width: var(--digit-width);
    --secs-digit-height: var(--digit-height);

    /* =========================================================
       INDIVIDUAL LABEL SIZING (Days, Hours, Minutes, Seconds text)
       ========================================================= */
    --days-label-height: clamp(22px, 5.5vw, 60px);
    --hours-label-height: clamp(22px, 5.5vw, 60px);
    --mins-label-height: clamp(20px, 5vw, 55px);
    --secs-label-height: clamp(22px, 5.5vw, 60px);
  }

  *{box-sizing:border-box;}

  /* --- BODY & PAGE CONTAINER --- */
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
  }

  /* --- HERO / SECTION 1 --- */
  .hero-section {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 130px; 
    padding-bottom: 20px;
    background: 
      linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
      url('RosesBg.webp') center/cover no-repeat;
  }

  /* --- SECTION 2 --- */
  .section-two {
    width: 100%;
    min-height: 100vh;
    background-color: #050406;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    padding-bottom: 40px;
  }

  /* --- HEADER GRAPHIC & OVERLAYED COUNTDOWN --- */
  .countdown-divider {
    position: relative;
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto;
    padding: 0 10px;
  }

  .countdown-header-img {
    width: 100%;             
    height: auto;             
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
  }

  .countdown-overlay-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 5px;
    z-index: 10;
  }

  .until-text-img {
    max-width: var(--until-width);
    width: 60%;
    height: auto;
    display: block;
    margin-top: 0;
    margin-bottom: clamp(2px, 1.5vw, 15px);
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
    transform: translateY(var(--until-margin-top)); 
  }

  .countdown-container {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: var(--countdown-gap);
    width: 100%;
  }

  .countdown-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .days-group .digit-box { width: var(--days-digit-width); height: var(--days-digit-height); }
  .hours-group .digit-box { width: var(--hours-digit-width); height: var(--hours-digit-height); }
  .mins-group .digit-box { width: var(--mins-digit-width); height: var(--mins-digit-height); }
  .secs-group .digit-box { width: var(--secs-digit-width); height: var(--secs-digit-height); }

  .days-group .label-box { height: var(--days-label-height); }
  .hours-group .label-box { height: var(--hours-label-height); }
  .mins-group .label-box { height: var(--mins-label-height); }
  .secs-group .label-box { height: var(--secs-label-height); }

  .digits-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: var(--digit-gap);
  }

  .digit-box:first-child {
    margin-right: var(--digit-gap);
  }

  .digit-box {
    width: var(--digit-width);   
    height: var(--digit-height); 
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .digit-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(240, 217, 166, 0.3));
  }

  .colon-box {
    width: var(--colon-width);   
    height: var(--digit-height);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(var(--colon-offset-y));
  }

  .colon-box img {
    width: 100%;
    height: var(--colon-height);
    object-fit: contain;
  }

  .label-box {
    height: var(--label-height); 
    margin-top: clamp(2px, 1vw, 12px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .label-box img {
    height: 100%;
    width: auto;
    object-fit: contain;
  }

  /* --- 18 TRADITIONS SECTION STYLES (DESKTOP ORIGINAL) --- */
  .traditions-container {
    width: 100%;
    max-width: 1000px; 
    margin: 40px auto 30px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
  }

  .traditions-header-img {
    width: 100%;
    max-width: 500px;
    height: auto;
    display: block;
    object-fit: contain;
    margin-bottom: 25px;
    filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
  }

  .hero-banner-section {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    row-gap: 20px;    
    column-gap: clamp(15px, 5vw, 80px); 
  }

  .tradition-card {
    display: block;
    text-decoration: none;
    transition: transform 0.3s ease, filter 0.3s ease;
    cursor: pointer;
  }

  .tradition-card:hover {
    transform: translateY(-5px) scale(1.02);
  }

  .hero-banner-img {
    width: 100%;
    margin: 0 auto;
    height: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.7));
  }

  .section-two-content {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    color: var(--gold-bright);
    text-align: center;
  }

  /* --- PRELOADER INTRO SCREEN --- */
  .intro-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #050406;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .intro-screen.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-spotlight {
    position: absolute;
    width: 140vw;
    height: 140vh;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(240, 217, 166, 0.15) 0%,
      rgba(201, 166, 107, 0.05) 35%,
      transparent 70%
    );
    pointer-events: none;
    animation: pulseSpotlight 4s ease-in-out infinite alternate;
  }

  @keyframes pulseSpotlight {
    0% { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  .intro-sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #F0D9A6;
    border-radius: 50%;
    box-shadow: 
      0 0 6px 2px rgba(240, 217, 166, 0.8),
      0 0 12px 4px rgba(201, 166, 107, 0.4);
    pointer-events: none;
    animation: sparkleTwinkle 2s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }

  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.4) rotate(45deg); }
  }

  .intro-image {
    position: relative;
    z-index: 2;
    width: min(80vw, 80vh);
    aspect-ratio: 1 / 1;
    max-width: 500px;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(240, 217, 166, 0.25));
    animation: growAndHold 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  @keyframes growAndHold {
    0% { transform: scale(0.65); opacity: 0; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  .intro-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }

  .intro-loading-text {
    margin-top: 15px;
    font-family: 'Goudy Bookletter 1911', serif;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--gold-bright);
    letter-spacing: 0.06em;
    opacity: 0;
    animation: fadeInMessage 1.2s ease forwards 0.4s;
  }

  .intro-subtext {
    font-size: clamp(14px, 3.5vw, 18px);
    letter-spacing: 0.08em;
    color: rgba(240, 217, 166, 0.85);
    display: inline-block;
    margin-top: 6px;
  }

  @keyframes fadeInMessage { to { opacity: 1; } }

  .loading-dots span {
    display: inline-block;
    opacity: 0;
    animation: pulseDots 1.4s infinite ease-in-out;
  }

  .loading-dots span:nth-child(1) { animation-delay: 0s; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulseDots {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  /* --- HEADER & NAVIGATION (DESKTOP ORIGINAL) --- */
  .site-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 15px 4vw;
    pointer-events: none;
  }

  .logo-link {
    display: block !important;
    width: var(--logo-size) !important;
    height: var(--logo-size) !important;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .logo-img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    transition: transform 0.2s ease, filter 0.2s ease;
    filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.5));
  }

  .logo-link:hover .logo-img {
    transform: scale(1.08);
    filter: drop-shadow(0px 4px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0px 0px 6px rgba(0, 0, 0, 0.5));
  }

  .nav-menu {
    display: flex;
    gap: clamp(12px, 4vw, 40px);
    align-items: center;
    pointer-events: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(50px, 8vw, 100px); 
    height: clamp(50px, 8vw, 100px); 
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .home-item { --scale: 1.1; }
  .rsvp-item { --scale: 1.1; }
  .where-item { --scale: 1.3; }

  .nav-item img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    display: block !important;
    object-fit: contain !important;
    transform: translate(-50%, -50%) scale(var(--scale, 1)) !important;
    transition: opacity 0.15s ease;
    filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
  }

  .nav-item img.hover-img {
    opacity: 0;
    pointer-events: none;
  }

  .nav-item:hover img.default-img { opacity: 0; }
  .nav-item:hover img.hover-img {
    opacity: 1;
    animation: stopMotion2D 0.3s steps(1) infinite !important;
  }

  @keyframes stopMotion2D {
    0% { rotate: 0deg; translate: 0px 0px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6)); }
    25% { rotate: 2deg; translate: 1px -1px; filter: drop-shadow(0px 0px 8px rgba(240,217,166,0.6)); }
    50% { rotate: 0deg; translate: 0px 1px; filter: drop-shadow(0px 0px 6px rgba(240,217,166,0.4)); }
    75% { rotate: -2deg; translate: -1px -1px; filter: drop-shadow(0px 0px 10px rgba(240,217,166,0.7)); }
  }

  /* =========================================================
     ONLY MOBILE OVERRIDES (PRESERVES DESKTOP COMPLETELY)
     ========================================================= */
  @media (max-width: 600px) {
    .site-header {
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding-top: 10px;
    }
    
    .hero-section {
      padding-top: 170px;
    }

    /* Enlarge navigation items specifically for mobile touch */
    .nav-item {
      width: clamp(70px, 16vw, 110px);
      height: clamp(70px, 16vw, 110px);
    }

    /* Mobile countdown tuning so text is legible and digits fit */
    :root {
      --until-width: 220px;
      --digit-width: 26px;
      --digit-height: 42px;
      --digit-gap: -12px;
      --colon-width: 10px;
      --colon-height: 20px;
      --countdown-gap: 2px;
      --days-label-height: 22px;
      --hours-label-height: 22px;
      --mins-label-height: 20px;
      --secs-label-height: 22px;
    }

    /* Mobile grid bounds for 18 traditions */
    .hero-banner-section {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .hero-banner-img {
      max-width: 280px;
    }
  }

  .hint{
    margin-top:28px;
    font-size:10px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(240,217,166,0.55);
    opacity:1;
    transition:opacity .5s ease;
  }
  .hint.hidden{ opacity:0; }

  .stage{
    perspective:1700px;
    width:min(90vw, 420px);
    height:min(90vw, 420px);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-top: 20px;
  }

  .shadow-blob{
    position:absolute;
    left:50%;
    bottom:6%;
    width:70%;
    height:14%;
    transform:translate(-50%, 0) scale(1);
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0) 70%);
    filter:blur(6px);
    transition:transform .35s ease-out, opacity .35s ease-out;
    pointer-events:none;
    z-index:0;
  }

  .scene{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.22,.75,.28,1);
    will-change:transform;
    position:relative;
    z-index:1;
  }

  .envelope{
    position:relative;
    --env-w: min(78vw, 340px);
    --env-h: calc(var(--env-w) * 0.66);
    width:var(--env-w);
    height:var(--env-h);
    transform-style:preserve-3d;
    cursor:pointer;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,0.45)) drop-shadow(0 4px 8px rgba(0,0,0,0.35));
    transition:filter .35s ease-out, transform .35s cubic-bezier(.22,.75,.28,1);
  }

  .envelope.hovering{
    filter: drop-shadow(0 34px 34px rgba(0,0,0,0.5)) drop-shadow(0 8px 14px rgba(0,0,0,0.4));
  }

  .interior{
    position:absolute;
    inset:0;
    z-index:0;
    background: linear-gradient(180deg, #17130d 0%, #2b2318 38%, var(--paper-shadow) 78%, var(--paper) 100%);
    border-radius:0 0 3px 3px;
    overflow:hidden;
  }
  .interior::after{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.5), transparent 65%);
  }

  .card-window{
    position:absolute;
    left:0; right:0;
    bottom:0;
    height:20%;
    overflow:hidden;
    z-index:1;
    transition:height .6s cubic-bezier(.25,.8,.25,1);
  }

  .envelope.open .flap{ z-index:1; }
  .envelope.open .card-window{ z-index:2; }

  .card{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%) translateY(0) scale(.97);
    height:calc(var(--env-h) * 1.75);
    aspect-ratio:74/105;
    background: linear-gradient(150deg, var(--card2), var(--card1) 60%);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10%;
    text-align:center;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity:.85;
    transition:opacity .7s cubic-bezier(.22,.8,.25,1) .1s, transform .7s cubic-bezier(.22,.8,.25,1) .1s;
    overflow:hidden;
  }

  .envelope.full .card{
    opacity:1;
    transform:translateX(-50%) translateY(-1.5%) scale(1);
  }

  .card::after{
    content:'';
    position:absolute;
    top:-20%; left:-60%;
    width:60%; height:140%;
    background:linear-gradient(100deg, transparent, rgba(240,217,166,0.16), transparent);
    transform:translateX(-40%) rotate(8deg);
    opacity:0;
    pointer-events:none;
  }
  .envelope.full .card::after{ animation:sheen 1.1s ease-out .55s 1; }
  @keyframes sheen{
    0%{ opacity:0; transform:translateX(-60%) rotate(8deg); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translateX(220%) rotate(8deg); }
  }

  .card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:none;
    opacity:0;
    filter:blur(18px) saturate(1.2) brightness(1.15);
    transform:scale(1.14);
    clip-path:circle(2% at 50% 50%);
    transition: opacity 1s cubic-bezier(.19,1,.22,1), filter 1.4s cubic-bezier(.19,1,.22,1), transform 1.6s cubic-bezier(.19,1,.22,1), clip-path 1.5s cubic-bezier(.19,1,.22,1);
  }
  .card img.show{
    opacity:1;
    filter:blur(0) saturate(1) brightness(1);
    transform:scale(1);
    clip-path:circle(75% at 50% 50%);
  }

  .card .placeholder{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:rgba(240,217,166,0.55);
    font-size: clamp(12px, 3vw, 18px);
    line-height:1.7;
    letter-spacing:.02em;
  }

  .pocket-front{
    position:absolute;
    left:0; right:0;
    bottom:0;
    height:37%;
    z-index:3;
    border-radius:0 0 3px 3px;
    overflow:hidden;
    background:linear-gradient(165deg, var(--paper-light), var(--paper) 55%, var(--paper-shadow) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -10px 18px -12px rgba(30,22,8,0.35);
  }

  .pocket-front svg{ position:absolute; inset:0; width:100%; height:100%; }

  .flap{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:64%;
    transform-origin:top center;
    transition:transform .7s cubic-bezier(.3,.68,.3,1);
    transform-style:preserve-3d;
    z-index:4;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }

  .flap-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .flap-face svg{ width:100%; height:100%; display:block; }
  .flap-back{ transform:rotateX(180deg); }

  .envelope-sides{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:64%;
    z-index:2;
    pointer-events:none;
  }
  .envelope-sides svg{ width:100%; height:100%; display:block; }

  .seal{
    transition:opacity .3s ease .1s, transform .4s cubic-bezier(.3,.68,.3,1);
    transform-origin:170px 122px;
  }
  .envelope.open .seal{ opacity:0; transform:scale(.6); }
  .envelope.open .flap{ transform:rotateX(-158deg); }
  .envelope.peek .card-window{ height:55%; }
  .envelope.full .card-window{
    height:175%;
    transition:height .75s cubic-bezier(.16,.85,.2,1);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(4,3,2,0.88);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .45s ease;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  /* --- TRADITION MODAL OVERLAYS (BLOOMS, TREASURES, BLESSINGS, STARLIGHTS) --- */
  .tradition-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s cubic-bezier(0.25, 1, 0.5, 1), backdrop-filter 1.4s cubic-bezier(0.25, 1, 0.5, 1);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
  }

  .tradition-modal-overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('traditionsbg.png') center/cover no-repeat;
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: -1;
  }

  .tradition-modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .tradition-modal-overlay.active::before {
    opacity: 0.75;
  }

  .tradition-modal-wrapper {
    position: relative;
    max-width: 90vw;
    max-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.85) translateY(20px) rotateX(4deg);
    transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
    opacity: 0;
    perspective: 1000px;
  }

  .tradition-modal-overlay.active .tradition-modal-wrapper {
    transform: scale(1) translateY(0) rotateX(0deg);
    opacity: 1;
  }

  .tradition-modal-img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.85));
    border-radius: 4px;
  }

  .big-card{
    --bc-w: min(90vw, calc((100dvh - 100px) / 1.4189), 560px);
    position:relative;
    width:var(--bc-w);
    height:calc(var(--bc-w) * (105 / 74));
    background:linear-gradient(150deg, var(--card2), var(--card1) 60%);
    border-radius: 0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:10%;
    text-align:center;
    transform:perspective(1400px) scale(.78) translateY(26px) rotateX(10deg);
    transform-origin:50% 85%;
    opacity:0;
    transition:transform 1s cubic-bezier(.16,.9,.18,1.25), opacity .5s ease;
    overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05);
    animation:glow-breathe 3.6s ease-in-out 1.9s infinite;
  }
  .overlay.show .big-card{
    display:flex;
    transform:perspective(1400px) scale(1) translateY(0) rotateX(0deg);
    opacity:1;
  }

  @keyframes glow-breathe{
    0%, 100%{ box-shadow:0 40px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 0 rgba(240,217,166,0); }
    50%{ box-shadow:0 40px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 34px rgba(201,166,107,0.35); }
  }

  .big-card::after{
    content:'';
    position:absolute;
    top:-20%; left:-60%;
    width:50%; height:140%;
    background:linear-gradient(100deg, transparent, rgba(240,217,166,0.14), transparent);
    transform:translateX(-40%) rotate(8deg);
    opacity:0;
    pointer-events:none;
  }
  .overlay.show .big-card::after{ animation:sheen 1.4s ease-out 1.9s 1; }

  .curtain{
    position:absolute;
    top:0; bottom:0;
    width:51%;
    z-index:3;
    background:linear-gradient(160deg, var(--card1) 0%, var(--card2) 55%, #0b0906 100%);
    transition:transform 1.15s cubic-bezier(.76,0,.16,1) .75s;
  }
  .curtain::after{
    content:'';
    position:absolute;
    top:0; bottom:0;
    width:1.5px;
    background:linear-gradient(var(--gold-bright), var(--gold));
    box-shadow:0 0 8px rgba(240,217,166,0.55);
  }
  .curtain-left{ left:0; transform-origin:left center; }
  .curtain-left::after{ right:0; }
  .curtain-right{ right:0; transform-origin:right center; }
  .curtain-right::after{ left:0; }
  .overlay.show .curtain-left{ transform:translateX(-104%) rotateY(-4deg); }
  .overlay.show .curtain-right{ transform:translateX(104%) rotateY(4deg); }

  .big-card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:none;
    opacity:0;
    filter:blur(20px) saturate(1.2) brightness(1.15);

  }
  .big-card img.show{
    opacity:1;
    filter:blur(0) saturate(1) brightness(1);
    transform:scale(1);

  }

  .big-card .placeholder{

<script>
  /* =========================================================
     1. ASSET PRELOADER LOGIC (PROPER LOADING TRACKER)
     ========================================================= */
  const introScreen = document.getElementById('introScreen');
  const MIN_PRELOAD_TIME = 2800; // Minimum time (in ms) to display preloader for visual effect
  const startTime = Date.now();

  // List of key images that must be downloaded before entering
  const assetsToPreload = [
    'youreinvited.png',
    'RosesBg.webp',
    'Logo.png',
    'HOME.png',
    'HOMELINE.png',
    'RSVP.png',
    'RSVPLINE.png',
    'WHERE.png',
    'WHERELINE.png',
    'CountdownHeader.png',
    'until.png',
    'days.png',
    'hours.png',
    'minutes.png',
    'seconds.png',
    'colon.png',
    'eighteentraditions.png',
    'gardenblooms.png',
    'treasures.png',
    'blessings.png',
    'starlights.png',
    '18blooms.png',
    '18treasures.png',
    '18blessings.png',
    '18starlights.png',
    'traditionsbg.png'
  ];

  function dismissPreloader() {
    if (!introScreen.classList.contains('fade-out')) {
      introScreen.classList.add('fade-out');
    }
  }

  // Preload image promises
  const imagePromises = assetsToPreload.map(src => {
    return new Promise((resolve) => {
      const img = new Image();
      img.src = src;
      img.onload = resolve;
      img.onerror = resolve; // Resolve anyway to prevent infinite loading on broken links
    });
  });

  // Wait for all images AND minimum display time
  Promise.all([
    Promise.all(imagePromises),
    new Promise(resolve => setTimeout(resolve, MIN_PRELOAD_TIME))
  ]).then(() => {
    dismissPreloader();
  });

  // Allow user to tap/click to skip manually if desired
  introScreen.addEventListener('click', dismissPreloader);


  /* =========================================================
     2. COUNTDOWN TIMER LOGIC
     ========================================================= */
  const eventDate = new Date("2026-08-21T17:00:00+08:00").getTime(); 

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = eventDate - now;

    if (distance < 0) {
      setDigits('days', 0);
      setDigits('hours', 0);
      setDigits('mins', 0);
      setDigits('secs', 0);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((distance % (1000 * 60)) / 1000);

    setDigits('days', days);
    setDigits('hours', hours);
    setDigits('mins', mins);
    setDigits('secs', secs);
  }

  function setDigits(idPrefix, value) {
    const str = String(value).padStart(2, '0');
    
    const tensImg = document.getElementById(`${idPrefix}-tens`);
    const onesImg = document.getElementById(`${idPrefix}-ones`);

    if (tensImg) tensImg.src = `${str[0]}.png`;
    if (onesImg) onesImg.src = `${str[1]}.png`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);


  /* =========================================================
     3. ENVELOPE & CARD ANIMATIONS
     ========================================================= */
  function wireAutoImage(imgId, placeholderId){
    const img = document.getElementById(imgId);
    const placeholder = document.getElementById(placeholderId);
    const reveal = () => {
      if(!img.getAttribute('src')) return;
      placeholder.style.display = 'none';
      img.style.display = 'block';
      requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('show')));
    };
    if(img.complete && img.naturalWidth) reveal();
    img.addEventListener('load', reveal);
    img.addEventListener('error', () => {
      placeholder.style.display = '';
      img.style.display = 'none';
    });
    new MutationObserver(reveal).observe(img, { attributes:true, attributeFilter:['src'] });
  }

  (function mirrorInviteImages(){
    const invite = document.getElementById('inviteImg');
    const big = document.getElementById('bigImg');
    const inviteSrc = invite.getAttribute('src');
    const bigSrc = big.getAttribute('src');
    if(inviteSrc && !bigSrc) big.setAttribute('src', inviteSrc);
    else if(bigSrc && !inviteSrc) invite.setAttribute('src', bigSrc);
  })();

  wireAutoImage('inviteImg', 'cardPlaceholder');
  wireAutoImage('bigImg', 'bigPlaceholder');

  const stage = document.getElementById('stage');
  const scene = document.getElementById('scene');
  const envelope = document.getElementById('envelope');
  const shadowBlob = document.getElementById('shadowBlob');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const hint = document.getElementById('hint');

  let isOpen = false;
  let isExpanded = false;
  const coarsePointer = window.matchMedia('(pointer: coarse)').matches;

  function tilt(e){
    if(isOpen || coarsePointer) return;
    const rect = stage.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    scene.style.transform = `rotateY(${x*20}deg) rotateX(${-y*20}deg) translateZ(6px)`;
    shadowBlob.style.transform = `translate(calc(-50% + ${x*-18}px), ${y*10}px) scale(${1 - Math.abs(x)*0.15})`;
  }

  function resetTilt(){
    scene.style.transform = 'rotateY(0deg) rotateX(0deg) translateZ(0px)';
    shadowBlob.style.transform = 'translate(-50%, 0) scale(1)';
    envelope.classList.remove('hovering');
  }

  stage.addEventListener('mousemove', tilt);
  stage.addEventListener('mouseenter', () => { if(!isOpen && !coarsePointer) envelope.classList.add('hovering'); });
  stage.addEventListener('mouseleave', resetTilt);

  function openEnvelope(){
    if(isOpen) return;
    isOpen = true;
    envelope.classList.add('open');
    resetTilt();
    hint.classList.add('hidden');

    setTimeout(() => {
      envelope.classList.add('peek');
    }, 200);

    setTimeout(() => {
      envelope.classList.remove('peek');
      envelope.classList.add('full');
    }, 800);

    setTimeout(() => {
      overlay.classList.add('show');
      isExpanded = true;
    }, 2900);
  }

  function closeEnvelope(){
    overlay.classList.remove('show');
    isExpanded = false;
    setTimeout(() => {
      envelope.classList.remove('open', 'peek', 'full');
      hint.classList.remove('hidden');
      isOpen = false;
    }, 300);
  }

  envelope.addEventListener('click', () => {
    if(!isOpen) openEnvelope();
    else if(isOpen && !isExpanded){
      overlay.classList.add('show');
      isExpanded = true;
    }
  });
  closeBtn.addEventListener('click', closeEnvelope);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeEnvelope(); });


  /* =========================================================
     4. TRADITIONS MODALS LOGIC
     ========================================================= */
  function setupTraditionModal(cardId, overlayId) {
    const card = document.getElementById(cardId);
    const overlay = document.getElementById(overlayId);

    if (card && overlay) {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        overlay.classList.add('active');
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('active');
        }
      });
    }
  }

  setupTraditionModal('gardenBloomsCard', 'bloomsOverlay');
  setupTraditionModal('treasuresCard', 'treasuresOverlay');
  setupTraditionModal('blessingsCard', 'blessingsOverlay');
  setupTraditionModal('starlightsCard', 'starlightsOverlay');
</script>
